services:
  spatial-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.spatial
    gpus: all
    environment:
      DATABASE_URL: postgresql+psycopg://video_editor:video_editor_dev@postgres:5432/video_editor
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3_BUCKET: ${MINIO_BUCKET:-media}
      COLMAP_COMMAND: ${COLMAP_COMMAND:-colmap}
      THREE_DGS_TRAIN_COMMAND: ${THREE_DGS_TRAIN_COMMAND:?Configure the mounted 3DGS trainer command}
      THREE_DGS_RENDER_COMMAND: ${THREE_DGS_RENDER_COMMAND:?Configure the mounted virtual-camera renderer command}
      SPATIAL_TRAINING_TIMEOUT_SECONDS: ${SPATIAL_TRAINING_TIMEOUT_SECONDS:-28800}
      SPATIAL_RENDER_TIMEOUT_SECONDS: ${SPATIAL_RENDER_TIMEOUT_SECONDS:-7200}
    volumes:
      - ./backend:/app
      - ${THREE_DGS_REPO_PATH:?Mount a pinned Graphdeco-compatible repository}:/opt/gaussian-splatting:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: celery -A app.worker.celery_app worker --loglevel=info --queues=${CELERY_INPAINTING_QUEUE:-celery}

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    image: ${REGISTRY:-local}/ai-video-editor-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    image: ${REGISTRY:-local}/ai-video-editor-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: ${REGISTRY:-local}/ai-video-editor-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERTS_PATH:-./certs}:/etc/nginx/certs:ro

name: Release preflight

# The render quality gate proves the product renders, using the development stack with
# MOCK_AI=true. Nothing verified the production wiring: docker-compose.production.yml,
# .env.production.example and infra/nginx/default.conf were never read by CI at all.
# This job closes that gap from the repository alone, so it needs no secret and runs on
# every pull request rather than only at deployment time.

on:
  pull_request:
    paths:
      - "docker-compose*.yml"
      - ".env.example"
      - ".env.production.example"
      - "infra/nginx/**"
      - "backend/Dockerfile*"
      - "backend/app/main.py"
      # The migration-chain check reads these off disk, so a migration PR must re-run it.
      - "backend/alembic.ini"
      - "backend/migrations/**"
      - "backend/start.sh"
      - "render.yaml"
      - "frontend/Dockerfile*"
      - "scripts/release_preflight.py"
      - "tests/preflight/**"
      # The public-journey checks read the whole v1 route surface and the
      # studio entry, so a PR that adds the missing project-creation route
      # has to re-run them -- that is when their strict xfails flip and ask
      # to be deleted.
      - "backend/app/api/v1/**"
      - "backend/app/tasks/platform_tasks.py"
      - "tests/qa/create_render_fixture.py"
      - "frontend/features/onboarding/studio-launchpad.tsx"
      - "frontend/features/media/local-media-bin.tsx"
      - "frontend/features/workspace/adaptive-editor-workspace.tsx"
      - ".github/workflows/render-quality.yml"
      - ".github/workflows/release-preflight.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install preflight dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 pytest==8.3.4
      - name: Verify the preflight rules still catch their regressions
        run: python -m pytest tests/preflight -q
      - name: Validate the release wiring
        run: python scripts/release_preflight.py

name: Frontend auth foundation checks

# Scoped to this stacked PR's own diff (frontend auth foundation: token
# storage, auth store/UI, authenticated fetch helper, and the project-status
# SSE/WebSocket transport rewrite). Deliberately separate from the existing,
# unrelated `render-quality.yml` / render-contract job (a much heavier
# full-stack docker-compose pipeline with a pre-existing, already-documented
# baseline failure — see artifacts/service-readiness/deployment-execution-final.md).
# This workflow gives real CI evidence (typecheck/build/tests) for the
# frontend auth code specifically, self-contained and fast, without touching
# or depending on that unrelated pipeline.

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-auth-checks.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-auth-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Deliberately the SAME origin the frontend itself is served from
      # (127.0.0.1:3000), not a separate backend port. This job never talks
      # to a real backend — every backend call in e2e/*.spec.ts is mocked via
      # page.route() — and a cross-origin target here would make those calls
      # genuine cross-origin fetches subject to real browser CORS/preflight
      # enforcement (and this app's own next.config.js sets
      # Cross-Origin-Embedder-Policy: require-corp for ffmpeg.wasm/
      # SharedArrayBuffer support, which is even stricter about cross-origin
      # loads). page.route().fulfill() mocks don't add CORS headers, so a
      # cross-origin API URL here silently fails every mocked request (the
      # browser blocks the response before the page ever sees it) without
      # page.route() itself reporting an error. This was a real, independent
      # bug (NEXT_PUBLIC_API_URL originally pointed at 127.0.0.1:8000,
      # nothing listens there in this job) — though it turned out to be
      # masked by a separate routing bug (see app/test-harness/*/page.tsx's
      # doc comments: the harness routes 404'd entirely for unrelated
      # reasons, so this CORS issue was never actually exercised until that
      # was fixed too). Same-origin sidesteps CORS and COEP entirely and
      # remains correct regardless.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3000
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify migrated frontend callers do not reintroduce caller identity
        run: |
          node -e "const fs=require('fs'); const p='features/editor/mobile-preview-handoff.tsx'; const s=fs.readFileSync(p,'utf8'); if(!s.includes('authenticatedFetch(') || s.includes('user_id')) { throw new Error(p + ' must use authenticatedFetch without client caller identity'); }"
      # Type-checking, linting and the production build live in the separate
      # `frontend-build` job below rather than here, so a compile failure and an
      # e2e failure stay independently attributable. They are NOT skipped: the
      # reason they used to be skipped no longer exists (see that job).
      # Browser binary only, no `--with-deps` apt-get install: two
      # consecutive runs of this workflow hung indefinitely (still no output
      # after 9+ minutes, well past the point a healthy `apt-get install`
      # would finish) inside `--with-deps`'s system-package installation on
      # this ubuntu-24.04 runner, after successfully fetching all apt index
      # files (Ign:/Get: lines for archive.ubuntu.com all completed; the
      # subsequent `apt-get install` of chromium's shared-library
      # dependencies is what never produced further output) — an
      # infrastructure/mirror issue, not something introduced by this PR.
      # GitHub's hosted ubuntu-24.04 runner image already ships the shared
      # libraries headless Chromium needs for the common case; if that turns
      # out incomplete here, the browser launch fails with a specific
      # missing-library error in the next step instead of hanging silently.
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Start the dev server
        run: |
          npm run dev -- --hostname 0.0.0.0 --port 3000 > /tmp/next-dev.log 2>&1 &
          echo $! > /tmp/next-dev.pid
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:3000/ > /dev/null && exit 0
            sleep 1
          done
          echo "frontend server did not become ready in time" >&2
          exit 1
      - name: Run frontend auth foundation tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test e2e/auth-foundation.spec.ts e2e/project-status-transport.spec.ts
      - name: Stop the dev server
        if: always()
        run: kill "$(cat /tmp/next-dev.pid)" 2>/dev/null || true
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-auth-checks-playwright-report
          path: frontend/playwright-report/

  frontend-build:
    # This job exists because the reason it did not exist has been fixed.
    #
    # Historically this workflow ran only `next dev` and deliberately had no
    # `tsc --noEmit` and no `next build`, because
    # frontend/features/workspace/adaptive-editor-workspace.tsx imported
    # "@/features/media/local-media-bin" and "@/features/media/semantic-media-bin",
    # neither of which existed anywhere in the repo. A project-wide typecheck or
    # production build compiles every route up front and always failed on that
    # chain -- and it could not be scoped around, because app/studio/page.tsx
    # imports the same chain transitively.
    #
    # Both files now exist and are tracked on main (added in 1c26f94, "restore
    # studio"). Re-verified on this branch, not assumed: `tsc --noEmit` reports
    # no diagnostics, and `next build` compiles all 8 routes -- including
    # /studio, the route that could not compile at all before -- with its
    # "Linting and checking validity of types" phase passing, which also covers
    # ESLint (`eslint` and `eslint-config-next` are real devDependencies now and
    # .eslintrc.json is present, so the old "no ESLint anywhere" note is stale
    # too; `next build` runs it, which is why there is no separate lint step).
    #
    # Leaving the gate off after the blocker was fixed means nothing stops the
    # exact same class of bug -- an import of a file that does not exist -- from
    # reaching main again and silently breaking the deployed frontend, which is
    # served from a real `next build` on Render.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      # `node --test` on Node 22 -- no new dependency. Guards
      # scripts/check-public-api-origin.mjs, which is what stops a production
      # image from inlining a loopback/private backend origin into the client
      # bundle. The guard itself runs in Dockerfile.production, not here: the
      # build step below deliberately uses a loopback URL.
      - name: Verify the backend-origin guard still catches its regressions
        run: npm run test:config
      - name: Production build
        # Same value as the e2e job, and same reason: nothing here talks to a
        # real backend, and this only needs to be a syntactically valid URL for
        # the build to inline.
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3000
        run: npm run build
      # The build output, not next.config.mjs, is what `next start` answers from on
      # Render, so this reads .next/routes-manifest.json and has to follow the build.
      - name: Verify the production build still declares the cross-origin isolation headers
        run: node scripts/check-isolation-headers.mjs

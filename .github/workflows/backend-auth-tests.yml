name: Backend auth unit tests

on:
  pull_request:
    paths:
      - "backend/app/core/security.py"
      - "backend/app/core/config.py"
      - "backend/app/core/progress.py"
      - "backend/app/auth/**"
      - "backend/app/api/v1/auth.py"
      - "backend/app/api/v1/project_status.py"
      - "backend/app/api/v1/ai.py"
      - "backend/app/ai/**"
      # Batch 2A (collaboration.py, audio_description.py, audio_enhancement.py)
      - "backend/app/api/v1/collaboration.py"
      - "backend/app/services/collaboration.py"
      - "backend/app/api/v1/audio_description.py"
      - "backend/app/services/audio_description.py"
      - "backend/app/tasks/audio_description_tasks.py"
      - "backend/app/api/v1/audio_enhancement.py"
      - "backend/app/services/audio_enhancement.py"
      - "backend/app/tasks/audio_enhancement_tasks.py"
      - "backend/app/services/storage.py"
      - "backend/app/worker.py"
      - "backend/app/models/entities.py"
      - "backend/migrations/**"
      - "backend/tests/test_auth.py"
      - "backend/tests/test_project_status.py"
      - "backend/tests/test_ai_analyze_video.py"
      - "backend/tests/test_collaboration.py"
      - "backend/tests/test_audio_description.py"
      - "backend/tests/test_audio_enhancement.py"
      # Stacked schema-fix PR (review_participants timestamp defaults)
      - "backend/tests/test_review_participant_schema.py"
      # Batch 2B (marketplace creator dashboard, compute node enrollment)
      - "backend/app/api/v1/marketplace.py"
      - "backend/app/schemas/marketplace.py"
      - "backend/app/services/marketplace_payments.py"
      - "backend/app/services/marketplace_security.py"
      - "backend/app/services/marketplace_settlement.py"
      - "backend/app/api/v1/distributed_compute.py"
      - "backend/app/schemas/distributed_compute.py"
      - "backend/app/services/distributed_compute.py"
      - "backend/app/services/compute_signaling.py"
      - "backend/app/tasks/distributed_compute_tasks.py"
      - "backend/tests/test_marketplace_dashboard.py"
      - "backend/tests/test_distributed_compute.py"
      # CI-fix: marketplace_templates/creator_connect_accounts/compute_nodes
      # timestamp server_default gap surfaced by this batch's own CI run
      - "backend/tests/test_marketplace_and_compute_schema.py"
      # Schema hygiene PR: template_licenses/distributed_render_*/compute_credit_ledger
      # timestamp server_default gap (same bug class, proven for these 5 tables)
      - "backend/tests/test_distributed_render_and_license_schema.py"
      # M1 mechanical migration (first SPOOFABLE_USER_ID slice): auto-editing routes
      - "backend/app/api/v1/auto_director.py"
      - "backend/app/api/v1/auto_narrative.py"
      - "backend/app/api/v1/auto_pip.py"
      - "backend/app/api/v1/auto_reframe.py"
      - "backend/app/api/v1/auto_sfx.py"
      - "backend/app/api/v1/beat_sync.py"
      - "backend/app/api/v1/beauty_enhancement.py"
      - "backend/app/api/v1/rough_cut.py"
      - "backend/app/schemas/auto_director.py"
      - "backend/app/schemas/auto_narrative.py"
      - "backend/app/schemas/auto_pip.py"
      - "backend/app/schemas/auto_reframe.py"
      - "backend/app/schemas/auto_sfx.py"
      - "backend/app/schemas/beat_sync.py"
      - "backend/app/schemas/beauty_enhancement.py"
      - "backend/app/schemas/rough_cut.py"
      - "backend/tests/test_auto_editing_identity.py"
      # CI-fix: auto_director_runs timestamp server_default gap surfaced by
      # M1's own test suite (same bug class as the schema-hygiene PR, this
      # time for a table M1's tests are the first to actually insert into)
      - "backend/tests/test_auto_director_schema.py"
      # M2 mechanical migration (second SPOOFABLE_USER_ID slice): spatial/optics routes
      - "backend/app/api/v1/spatial.py"
      - "backend/app/api/v1/spatial_text.py"
      - "backend/app/api/v1/spatial_video.py"
      - "backend/app/api/v1/optics.py"
      - "backend/app/api/v1/film_optics.py"
      - "backend/app/api/v1/relighting.py"
      - "backend/app/api/v1/parallax.py"
      - "backend/app/api/v1/travel_maps.py"
      - "backend/app/schemas/spatial.py"
      - "backend/app/schemas/spatial_text.py"
      - "backend/app/schemas/spatial_video.py"
      - "backend/app/schemas/optics.py"
      - "backend/app/schemas/film_optics.py"
      - "backend/app/schemas/relighting.py"
      - "backend/app/schemas/parallax.py"
      - "backend/app/schemas/travel_maps.py"
      - "backend/tests/test_spatial_optics_identity.py"
      # CI-fix: spatial_video_jobs timestamp server_default gap, discovered
      # while auditing M2's own candidate files (same bug class as the
      # 0030-0033 fixes)
      - "backend/tests/test_spatial_video_job_schema.py"
      # Priority fix (post-M2): distributed_compute.py's render-offload
      # endpoint had no verified caller identity at all
      - "backend/tests/test_render_offload_identity.py"
      # Marketplace mixed-auth fix (post-priority-fix): publish_template,
      # start_connect_onboarding, create_checkout, apply_template_license
      - "backend/tests/test_marketplace_mixed_identity.py"
      - "backend/tests/conftest.py"
      - "backend/tests/test_alembic_version_column_width.py"
      - "backend/requirements.txt"
      - ".github/workflows/backend-auth-tests.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  auth-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # pgvector/pgvector, not plain postgres — migration 0007 runs
        # `CREATE EXTENSION vector`, which plain postgres images don't ship.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: video_editor
          POSTGRES_USER: video_editor
          POSTGRES_PASSWORD: video_editor_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U video_editor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        # Needed starting with Batch 1: app/core/progress.py and
        # app/api/v1/project_status.py import `redis` at module level (the
        # pub/sub-backed project status stream), so it must be importable
        # and reachable for that router to load and for tests to exercise a
        # real connection for the "owner accepted" happy-path cases.
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://video_editor:video_editor_dev@localhost:5432/video_editor
      REDIS_URL: redis://localhost:6379/0
      # CI-only secret, never reused anywhere real. Production sets JWT_SECRET_KEY
      # via the host's real secret manager, not this file.
      JWT_SECRET_KEY: ci-test-only-secret-do-not-reuse-1234567890
      # CI-only Fernet key (generated for this workflow only, never reused
      # anywhere real). Needed by test_marketplace_mixed_identity.py's
      # test_publish_rightful_owner_succeeds, the first test in this CI
      # slice to exercise publish_template's encrypt_template_payload() ->
      # app.services.marketplace_security._fernet(), which raises
      # MarketplaceSecurityError (503) when MARKETPLACE_TEMPLATE_ENCRYPTION_KEY
      # is unset. Production sets this via the host's real secret manager,
      # not this file.
      MARKETPLACE_TEMPLATE_ENCRYPTION_KEY: h1fe4qWkECesYJIJFWNTSN1xZ43hbHF6jggP8wxroJA=
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the minimal dependency set this test slice needs
        working-directory: backend
        run: |
          pip install \
            fastapi==0.115.6 \
            "uvicorn[standard]==0.34.0" \
            sqlalchemy==2.0.36 \
            "psycopg[binary]==3.2.3" \
            alembic==1.14.0 \
            pydantic-settings==2.7.1 \
            python-multipart==0.0.20 \
            pgvector==0.3.6 \
            bcrypt==4.2.1 \
            PyJWT==2.10.1 \
            redis==5.2.1 \
            pytest==8.3.4 \
            httpx==0.27.2 \
            celery==5.4.0 \
            boto3==1.35.90 \
            cryptography==43.0.3 \
            Pillow==11.0.0 \
            numpy==1.26.4 \
            opencv-python-headless==4.10.0.84 \
            scipy==1.14.1 \
            "onnxruntime>=1.20,<2"
      # Pillow/numpy/opencv-python-headless are new as of M1: loading
      # app/api/v1/auto_narrative.py and app/api/v1/beat_sync.py (via
      # importlib, same as every other route module in this test slice)
      # transitively imports app/tasks/auto_narrative_tasks.py and
      # app/tasks/beat_sync_tasks.py, both of which import
      # app/tasks/render_tasks.py at module level. render_tasks.py imports
      # ~25 rendering-effect service modules, three of which import a real
      # third-party package at module level rather than lazily inside a
      # function: app/services/language_review_overlay.py and
      # app/services/mechanical_ar_overlay.py both do `import numpy as np`
      # and `from PIL import Image, ImageDraw, ImageFont`;
      # app/services/forensic_provenance.py does `import cv2` and
      # `import numpy as np`. This was surfaced by M1's first real CI run
      # (ModuleNotFoundError: No module named 'PIL'), then the rest of the
      # chain was traced statically (all ~25 render_tasks.py service
      # imports read directly, not guessed) to catch every missing package
      # in one fix rather than one CI round-trip per package. All three are
      # ordinary, already-in-requirements.txt packages (headless OpenCV
      # variant, no GUI deps) — not GPU/ML frameworks — genuinely required
      # just to *import* these two route modules, independent of whether
      # any test actually exercises rendering. No other route module in
      # this test slice (auto_director.py, auto_pip.py, auto_reframe.py,
      # auto_sfx.py, beauty_enhancement.py, rough_cut.py, and every
      # pre-existing module already covered by this workflow) imports
      # render_tasks.py or otherwise needs these three packages.
      # scipy/onnxruntime are new as of M2: app/api/v1/film_optics.py imports
      # app.services.lens_physics at module level, which does
      # `from scipy.special import j1` at module level; app/api/v1/relighting.py
      # imports app.services.virtual_relighting at module level, which does
      # `import onnxruntime` at module level. Both were traced statically
      # (reading each service module's imports directly, not guessed) rather
      # than discovered one CI round-trip at a time. Both packages are
      # already pinned in requirements.txt (scipy==1.14.1,
      # onnxruntime>=1.20,<2) — pre-existing project dependencies for the
      # optical-flow/lens-correction and ONNX-based relighting-model
      # pipelines, not new additions invented for this test slice. No other
      # M2 route module (spatial.py, spatial_text.py, spatial_video.py,
      # optics.py, parallax.py, travel_maps.py) or their task modules import
      # scipy or onnxruntime — confirmed by reading each task module's
      # imports directly.
      # cryptography is new as of Batch 2B: app/services/marketplace_security.py
      # imports Fernet at module level (marketplace.py's encrypted-template
      # payload envelope), and app/services/distributed_compute.py's
      # verify_node_signature imports Ed25519PublicKey from it (already
      # exercised indirectly by this batch's node-signature regression
      # test). Neither app/api/v1/marketplace.py nor
      # app/services/marketplace_payments.py imports the `stripe` package
      # at module level — `import stripe` only happens inside
      # marketplace_payments.py's `_stripe()` function body — so this test
      # slice does not need the Stripe SDK installed to load marketplace.py
      # or exercise the dashboard route's authorization gate.
      # celery/boto3 are new as of Batch 2A: app/api/v1/audio_description.py
      # and app/api/v1/audio_enhancement.py import their Celery task modules
      # (app/tasks/audio_description_tasks.py, app/tasks/audio_enhancement_tasks.py)
      # at module level, which transitively import app.worker (needs the
      # `celery` package to construct the Celery() app object — no broker
      # connection happens at import time) and app.services.storage (needs
      # `boto3`/`botocore` for its module-level `import boto3` — no AWS/S3
      # credentials or network call happens at import time either). Neither
      # pulls in an ML/audio-processing stack: app/services/audio_description.py
      # and app/services/audio_enhancement.py (the actual DSP/generation
      # logic) only import stdlib (subprocess, wave, shlex) plus app.core.config
      # at module level — confirmed by reading both files — so this test
      # slice still does not need ffmpeg, torch, or any GPU/ML dependency to
      # import and exercise the security-relevant route code.
      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Verify alembic_version.version_num is wide enough
        working-directory: backend
        run: python -m pytest tests/test_alembic_version_column_width.py -v
      - name: Run auth security tests
        working-directory: backend
        run: python -m pytest tests/test_auth.py -v
      - name: Run project_status.py security tests (Batch 1)
        working-directory: backend
        run: python -m pytest tests/test_project_status.py -v
      - name: Run ai.py analyze-video security tests (Batch 1)
        working-directory: backend
        run: python -m pytest tests/test_ai_analyze_video.py -v
      - name: Run collaboration.py security tests (Batch 2A)
        working-directory: backend
        run: python -m pytest tests/test_collaboration.py -v
      - name: Run audio_description.py security tests (Batch 2A)
        working-directory: backend
        run: python -m pytest tests/test_audio_description.py -v
      - name: Run audio_enhancement.py security tests (Batch 2A)
        working-directory: backend
        run: python -m pytest tests/test_audio_enhancement.py -v
      - name: Run review_participants schema regression tests (schema-fix PR)
        working-directory: backend
        run: python -m pytest tests/test_review_participant_schema.py -v
      - name: Run marketplace/compute timestamp schema regression tests (Batch 2B CI fix)
        working-directory: backend
        run: python -m pytest tests/test_marketplace_and_compute_schema.py -v
      - name: Run template_licenses/distributed_render_*/compute_credit_ledger schema regression tests (schema hygiene PR)
        working-directory: backend
        run: python -m pytest tests/test_distributed_render_and_license_schema.py -v
      - name: Run marketplace.py creator dashboard security tests (Batch 2B)
        working-directory: backend
        run: python -m pytest tests/test_marketplace_dashboard.py -v
      - name: Run distributed_compute.py node enrollment security tests (Batch 2B)
        working-directory: backend
        run: python -m pytest tests/test_distributed_compute.py -v
      - name: Run auto_director_runs schema regression tests (M1 CI fix)
        working-directory: backend
        run: python -m pytest tests/test_auto_director_schema.py -v
      - name: Run auto-editing route identity security tests (M1)
        working-directory: backend
        run: python -m pytest tests/test_auto_editing_identity.py -v
      - name: Run spatial_video_jobs schema regression tests (M2 CI fix)
        working-directory: backend
        run: python -m pytest tests/test_spatial_video_job_schema.py -v
      - name: Run spatial/optics route identity security tests (M2)
        working-directory: backend
        run: python -m pytest tests/test_spatial_optics_identity.py -v
      - name: Run render-offload route identity security tests (priority fix)
        working-directory: backend
        run: python -m pytest tests/test_render_offload_identity.py -v
      - name: Run marketplace mixed-auth route identity security tests
        working-directory: backend
        run: python -m pytest tests/test_marketplace_mixed_identity.py -v

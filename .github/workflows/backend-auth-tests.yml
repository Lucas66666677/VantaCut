name: Backend auth unit tests

on:
  pull_request:
    paths:
      - "backend/app/core/security.py"
      - "backend/app/core/config.py"
      - "backend/app/core/progress.py"
      - "backend/app/auth/**"
      - "backend/app/api/v1/auth.py"
      - "backend/app/api/v1/project_status.py"
      - "backend/app/api/v1/ai.py"
      - "backend/app/ai/**"
      # Batch 2A (collaboration.py, audio_description.py, audio_enhancement.py)
      - "backend/app/api/v1/collaboration.py"
      - "backend/app/services/collaboration.py"
      - "backend/app/api/v1/audio_description.py"
      - "backend/app/services/audio_description.py"
      - "backend/app/tasks/audio_description_tasks.py"
      - "backend/app/api/v1/audio_enhancement.py"
      - "backend/app/services/audio_enhancement.py"
      - "backend/app/tasks/audio_enhancement_tasks.py"
      - "backend/app/services/storage.py"
      - "backend/app/worker.py"
      - "backend/app/models/entities.py"
      - "backend/migrations/**"
      - "backend/tests/test_auth.py"
      - "backend/tests/test_project_status.py"
      - "backend/tests/test_ai_analyze_video.py"
      - "backend/tests/test_collaboration.py"
      - "backend/tests/test_audio_description.py"
      - "backend/tests/test_audio_enhancement.py"
      # Stacked schema-fix PR (review_participants timestamp defaults)
      - "backend/tests/test_review_participant_schema.py"
      # Batch 2B (marketplace creator dashboard, compute node enrollment)
      - "backend/app/api/v1/marketplace.py"
      - "backend/app/schemas/marketplace.py"
      - "backend/app/services/marketplace_payments.py"
      - "backend/app/services/marketplace_security.py"
      - "backend/app/services/marketplace_settlement.py"
      - "backend/app/api/v1/distributed_compute.py"
      - "backend/app/schemas/distributed_compute.py"
      - "backend/app/services/distributed_compute.py"
      - "backend/app/services/compute_signaling.py"
      - "backend/app/tasks/distributed_compute_tasks.py"
      - "backend/tests/test_marketplace_dashboard.py"
      - "backend/tests/test_distributed_compute.py"
      # CI-fix: marketplace_templates/creator_connect_accounts/compute_nodes
      # timestamp server_default gap surfaced by this batch's own CI run
      - "backend/tests/test_marketplace_and_compute_schema.py"
      # Schema hygiene PR: template_licenses/distributed_render_*/compute_credit_ledger
      # timestamp server_default gap (same bug class, proven for these 5 tables)
      - "backend/tests/test_distributed_render_and_license_schema.py"
      - "backend/tests/conftest.py"
      - "backend/tests/test_alembic_version_column_width.py"
      - "backend/requirements.txt"
      - ".github/workflows/backend-auth-tests.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  auth-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # pgvector/pgvector, not plain postgres — migration 0007 runs
        # `CREATE EXTENSION vector`, which plain postgres images don't ship.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: video_editor
          POSTGRES_USER: video_editor
          POSTGRES_PASSWORD: video_editor_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U video_editor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        # Needed starting with Batch 1: app/core/progress.py and
        # app/api/v1/project_status.py import `redis` at module level (the
        # pub/sub-backed project status stream), so it must be importable
        # and reachable for that router to load and for tests to exercise a
        # real connection for the "owner accepted" happy-path cases.
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://video_editor:video_editor_dev@localhost:5432/video_editor
      REDIS_URL: redis://localhost:6379/0
      # CI-only secret, never reused anywhere real. Production sets JWT_SECRET_KEY
      # via the host's real secret manager, not this file.
      JWT_SECRET_KEY: ci-test-only-secret-do-not-reuse-1234567890
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the minimal dependency set this test slice needs
        working-directory: backend
        run: |
          pip install \
            fastapi==0.115.6 \
            "uvicorn[standard]==0.34.0" \
            sqlalchemy==2.0.36 \
            "psycopg[binary]==3.2.3" \
            alembic==1.14.0 \
            pydantic-settings==2.7.1 \
            python-multipart==0.0.20 \
            pgvector==0.3.6 \
            bcrypt==4.2.1 \
            PyJWT==2.10.1 \
            redis==5.2.1 \
            pytest==8.3.4 \
            httpx==0.27.2 \
            celery==5.4.0 \
            boto3==1.35.90 \
            cryptography==43.0.3
      # cryptography is new as of Batch 2B: app/services/marketplace_security.py
      # imports Fernet at module level (marketplace.py's encrypted-template
      # payload envelope), and app/services/distributed_compute.py's
      # verify_node_signature imports Ed25519PublicKey from it (already
      # exercised indirectly by this batch's node-signature regression
      # test). Neither app/api/v1/marketplace.py nor
      # app/services/marketplace_payments.py imports the `stripe` package
      # at module level — `import stripe` only happens inside
      # marketplace_payments.py's `_stripe()` function body — so this test
      # slice does not need the Stripe SDK installed to load marketplace.py
      # or exercise the dashboard route's authorization gate.
      # celery/boto3 are new as of Batch 2A: app/api/v1/audio_description.py
      # and app/api/v1/audio_enhancement.py import their Celery task modules
      # (app/tasks/audio_description_tasks.py, app/tasks/audio_enhancement_tasks.py)
      # at module level, which transitively import app.worker (needs the
      # `celery` package to construct the Celery() app object — no broker
      # connection happens at import time) and app.services.storage (needs
      # `boto3`/`botocore` for its module-level `import boto3` — no AWS/S3
      # credentials or network call happens at import time either). Neither
      # pulls in an ML/audio-processing stack: app/services/audio_description.py
      # and app/services/audio_enhancement.py (the actual DSP/generation
      # logic) only import stdlib (subprocess, wave, shlex) plus app.core.config
      # at module level — confirmed by reading both files — so this test
      # slice still does not need ffmpeg, torch, or any GPU/ML dependency to
      # import and exercise the security-relevant route code.
      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Verify alembic_version.version_num is wide enough
        working-directory: backend
        run: python -m pytest tests/test_alembic_version_column_width.py -v
      - name: Run auth security tests
        working-directory: backend
        run: python -m pytest tests/test_auth.py -v
      - name: Run project_status.py security tests (Batch 1)
        working-directory: backend
        run: python -m pytest tests/test_project_status.py -v
      - name: Run ai.py analyze-video security tests (Batch 1)
        working-directory: backend
        run: python -m pytest tests/test_ai_analyze_video.py -v
      - name: Run collaboration.py security tests (Batch 2A)
        working-directory: backend
        run: python -m pytest tests/test_collaboration.py -v
      - name: Run audio_description.py security tests (Batch 2A)
        working-directory: backend
        run: python -m pytest tests/test_audio_description.py -v
      - name: Run audio_enhancement.py security tests (Batch 2A)
        working-directory: backend
        run: python -m pytest tests/test_audio_enhancement.py -v
      - name: Run review_participants schema regression tests (schema-fix PR)
        working-directory: backend
        run: python -m pytest tests/test_review_participant_schema.py -v
      - name: Run marketplace/compute timestamp schema regression tests (Batch 2B CI fix)
        working-directory: backend
        run: python -m pytest tests/test_marketplace_and_compute_schema.py -v
      - name: Run template_licenses/distributed_render_*/compute_credit_ledger schema regression tests (schema hygiene PR)
        working-directory: backend
        run: python -m pytest tests/test_distributed_render_and_license_schema.py -v
      - name: Run marketplace.py creator dashboard security tests (Batch 2B)
        working-directory: backend
        run: python -m pytest tests/test_marketplace_dashboard.py -v
      - name: Run distributed_compute.py node enrollment security tests (Batch 2B)
        working-directory: backend
        run: python -m pytest tests/test_distributed_compute.py -v

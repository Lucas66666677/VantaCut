        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: celery -A app.worker.celery_app worker --loglevel=info --queues=celery,render

  # Opt-in: needs NVIDIA Container Toolkit plus a tested MV-HEVC-capable driver.
  # Apple spatial metadata writing/verification is intentionally supplied by a macOS bridge command.
  spatial-worker:
    profiles: ["spatial"]
    build:
      context: ./backend
      dockerfile: Dockerfile.spatial-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://video_editor:video_editor_dev@postgres:5432/video_editor
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3_BUCKET: ${MINIO_BUCKET:-media}
      DEPTH_ANYTHING_ONNX_PATH: ${DEPTH_ANYTHING_ONNX_PATH:-}
      SPATIAL_FFMPEG_PATH: /opt/spatial-ffmpeg/bin/ffmpeg
      SPATIAL_FFPROBE_PATH: /opt/spatial-ffmpeg/bin/ffprobe
      SPATIAL_METADATA_WRITER_COMMAND: ${SPATIAL_METADATA_WRITER_COMMAND:-}
      SPATIAL_METADATA_VERIFIER_COMMAND: ${SPATIAL_METADATA_VERIFIER_COMMAND:-}
      SPATIAL_MVHEVC_TIMEOUT_SECONDS: ${SPATIAL_MVHEVC_TIMEOUT_SECONDS:-14400}
      CELERY_SPATIAL_QUEUE: ${CELERY_SPATIAL_QUEUE:-spatial}
    gpus: all
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: celery -A app.worker.celery_app worker --loglevel=info --queues=spatial --concurrency=1

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DATABASE_URL: postgresql+psycopg://video_editor:video_editor_dev@postgres:5432/video_editor
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3_BUCKET: ${MINIO_BUCKET:-media}
      SOCIAL_TOKEN_ENCRYPTION_KEY: ${SOCIAL_TOKEN_ENCRYPTION_KEY:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      THUMBNAIL_GENERATION_COMMAND: ${THUMBNAIL_GENERATION_COMMAND:-}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: celery -A app.worker.celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: npm run dev -- --hostname 0.0.0.0

volumes:
  postgres_data:
  redis_data:
  minio_data:
  frontend_node_modules:
  frontend_next:
